# Trigger deploy pancake-sync khi push lên develop.
name: Deploy pancake-sync

on:
  push:
    branches: [develop]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        env:
          META_VERIFY_TOKEN: ${{ secrets.META_VERIFY_TOKEN }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy_vcc
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: META_VERIFY_TOKEN,META_APP_SECRET
          # Dừng ngay nếu một lệnh trong script fail (tránh báo success giả).
          script_stop: true
          script: |
            cd /srv/VCC/pancake-sync/pancake-sync-main

            # Một số lần vận hành cũ tạo file Git bằng root, khiến deploy_vcc
            # không thể ghi vào .git/objects. User deploy đã có quyền Docker,
            # nên dùng container tạm để trả ownership mà không cần SSH/sudo.
            DEPLOY_UID="$(id -u)"
            DEPLOY_GID="$(id -g)"
            echo "Ensuring repository ownership is ${DEPLOY_UID}:${DEPLOY_GID}..."
            docker run --rm \
              -v "$(pwd):/workspace" \
              alpine:3.20 \
              chown -R "${DEPLOY_UID}:${DEPLOY_GID}" /workspace

            # Pull cùng nhánh trigger workflow (develop).
            git pull origin develop
            # .env không commit vào git — phải tạo sẵn trên VPS.
            if [ ! -f .env ]; then
              echo "ERROR: Missing .env at $(pwd)/.env — create it on VPS before deploy."
              exit 1
            fi

            # Đồng bộ secret Meta từ GitHub Actions xuống .env mà không commit
            # secret vào repository. Bỏ qua biến chưa được cấu hình trên GitHub.
            if [ -n "${META_VERIFY_TOKEN}" ]; then
              if grep -q '^META_VERIFY_TOKEN=' .env; then
                sed -i "s|^META_VERIFY_TOKEN=.*|META_VERIFY_TOKEN=${META_VERIFY_TOKEN}|" .env
              else
                printf '\nMETA_VERIFY_TOKEN=%s\n' "${META_VERIFY_TOKEN}" >> .env
              fi
            fi

            if [ -n "${META_APP_SECRET}" ]; then
              if grep -q '^META_APP_SECRET=' .env; then
                sed -i "s|^META_APP_SECRET=.*|META_APP_SECRET=${META_APP_SECRET}|" .env
              else
                printf 'META_APP_SECRET=%s\n' "${META_APP_SECRET}" >> .env
              fi
            fi

            docker compose build
            # Recreate để mọi thay đổi trong env_file được nạp vào container.
            docker compose up -d --force-recreate
            docker image prune -f
