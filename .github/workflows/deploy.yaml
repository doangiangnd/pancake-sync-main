# Trigger deploy pancake-sync to develop branch.
name: Deploy pancake-sync

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy_vcc
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /srv/VCC/pancake-sync/pancake-sync-main
            git pull origin main
            docker compose build
            docker compose up -d
            docker image prune -f
