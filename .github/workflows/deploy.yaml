# Trigger deploy pancake-sync khi push lên develop.
name: Deploy pancake-sync

on:
  push:
    branches: [develop]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: deploy_vcc
          key: ${{ secrets.VPS_SSH_KEY }}
          # Dừng ngay nếu một lệnh trong script fail (tránh báo success giả).
          script_stop: true
          script: |
            cd /srv/VCC/pancake-sync/pancake-sync-main
            # Pull cùng nhánh trigger workflow (develop).
            git pull origin develop
            # Cần file .env trên VPS (không commit vào git).
            test -f .env
            docker compose build
            docker compose up -d
            docker image prune -f
